name: noam-production

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: noam-web:${NOAM_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ${NOAM_ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ${NOAM_ENV_FILE:-.env.production}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ${NOAM_ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /backups
        while :; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          target="/backups/noam-$${stamp}.dump"
          pg_dump "$$DATABASE_URL" --format=custom --no-owner --no-privileges > "$$target.tmp"
          test -s "$$target.tmp"
          mv "$$target.tmp" "$$target"
          find /backups -type f -name 'noam-*.dump' -mtime +"$${BACKUP_RETENTION_DAYS:-14}" -delete
          sleep "$${BACKUP_INTERVAL_SECONDS:-86400}"
        done
    volumes:
      - postgres_backups:/backups
    networks:
      - backend

  tools:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: noam-web-tools:${NOAM_IMAGE_TAG:-latest}
    profiles: ["tools"]
    env_file: ${NOAM_ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend

volumes:
  postgres_data:
  postgres_backups:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: false
