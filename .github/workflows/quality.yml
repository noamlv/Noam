name: Quality

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: noam
          POSTGRES_USER: noam
          POSTGRES_PASSWORD: noam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noam -d noam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: "https://noam.pe"
      DATABASE_URL: "postgres://noam:noam@127.0.0.1:5432/noam"
      NOAM_DB_SSL: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run test:smoke:ci
